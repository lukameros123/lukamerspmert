<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08090c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI Camera</title>
  <style>
    :root { color-scheme: dark; --red: #ff283b; --bg: #07090e; --white: #f6f7fa; --muted: #a3a8b3; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--white); }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .app { position:relative; height:100%; height:100dvh; width:100%; overflow:hidden; isolation:isolate; }
    .scene { position:absolute; inset:0; background:linear-gradient(165deg,#0e111a 0%,#08090d 60%,#11090d 100%); }
    .scene::after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 75%,transparent 10%,#0008 100%); }
    .camera { width:100%; height:100%; object-fit:cover; display:block; transform-origin:center; opacity:0; transition:opacity .24s ease; }
    .is-running .camera { opacity:1; }
    #boxes { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .scanline { pointer-events:none; position:absolute; inset:0; opacity:0; background:linear-gradient(transparent 49.95%,#ff293322 50%,transparent 50.05%); }
    .is-running .scanline { opacity:1; }
    .landing { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:31px; padding:28px; background:radial-gradient(circle at 50% 43%,#17111c 0%,#0c0d13 44%,#07090e 85%); z-index:3; transition:opacity .2s; }
    .is-running .landing { opacity:0; pointer-events:none; visibility:hidden; }
    .mark { position:relative; width:100px; height:100px; border:1px solid #ffffff20; border-radius:27px; display:grid; place-items:center; background:#ffffff06; box-shadow:0 20px 70px #0008; }
    .mark svg { width:49px; height:49px; stroke:var(--red); stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .mark:before,.mark:after { content:""; position:absolute; width:17px; height:17px; border:2px solid var(--red); }
    .mark:before { top:-5px; left:-5px; border-right:0; border-bottom:0; border-top-left-radius:7px; }
    .mark:after { right:-5px; bottom:-5px; border-top:0; border-left:0; border-bottom-right-radius:7px; }
    .brand { margin:0; font-size:clamp(26px,8vw,38px); font-weight:760; letter-spacing:.17em; white-space:nowrap; }
    .brand b { color:var(--red); }
    .choices { display:flex; background:#ffffff09; padding:5px; gap:5px; border:1px solid #ffffff13; border-radius:18px; width:min(100%,300px); }
    .choice { flex:1; min-height:51px; padding:10px 14px; border:0; border-radius:13px; background:transparent; color:#9ea2ae; font-size:15px; font-weight:700; }
    .choice[aria-pressed="true"] { color:white; background:#2b2029; box-shadow:inset 0 0 0 1px #ff283b55; }
    .start { width:min(100%,300px); height:60px; border:0; border-radius:17px; color:white; background:var(--red); font-weight:850; font-size:16px; letter-spacing:.13em; box-shadow:0 12px 34px #ff283b33; }
    .start:disabled { opacity:.55; cursor:default; }
    .start:active { transform:scale(.98); }
    .toolbar { position:absolute; z-index:2; top:calc(env(safe-area-inset-top,0px) + 16px); left:15px; right:15px; display:flex; align-items:flex-start; gap:12px; justify-content:space-between; opacity:0; pointer-events:none; transition:opacity .2s; }
    .is-running .toolbar,.is-running .bottom { opacity:1; pointer-events:auto; }
    .counter { background:#050508c9; border:1px solid #ffffff28; border-radius:17px; padding:10px 13px; min-width:128px; backdrop-filter:blur(12px); }
    .counter-top { font-size:10px; letter-spacing:.13em; display:flex; align-items:center; gap:7px; font-weight:750; color:#e3e2e5; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red); }
    .counter-big { margin-top:3px; display:flex; gap:9px; align-items:baseline; }
    #number { font-size:40px; line-height:1.05; font-weight:850; font-variant-numeric:tabular-nums; }
    #plural { color:#c3c5ce; font-size:12px; font-weight:750; letter-spacing:.04em; }
    .mode-switch { display:flex; padding:4px; border-radius:14px; border:1px solid #ffffff2b; background:#050508c9; backdrop-filter:blur(12px); gap:3px; }
    .mode-switch button { border:none; border-radius:10px; padding:11px 10px; background:none; color:#9ea2aa; font-size:12px; font-weight:780; }
    .mode-switch button[aria-pressed="true"] { background:#ff283b; color:white; }
    .bottom { position:absolute; left:15px; right:15px; bottom:calc(env(safe-area-inset-bottom,0px) + 17px); z-index:2; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; opacity:0; pointer-events:none; transition:opacity .2s; }
    .stop { color:#fff; background:#060609d9; backdrop-filter:blur(12px); border:1px solid #ffffff31; height:49px; padding:0 17px; border-radius:14px; font-weight:760; font-size:12px; letter-spacing:.04em; }
    .zoom { background:#060609d9; backdrop-filter:blur(12px); border:1px solid #ffffff31; border-radius:14px; padding:10px 12px 10px; width:156px; }
    .zoomhead { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; font-weight:750; letter-spacing:.08em; }
    .zoomhead output { color:#ff5364; font-size:13px; font-variant-numeric:tabular-nums; }
    input[type=range] { appearance:none; -webkit-appearance:none; display:block; height:18px; margin:7px 0 0; width:100%; background:transparent; }
    input[type=range]::-webkit-slider-runnable-track { height:3px; background:linear-gradient(90deg,var(--red),#6b333d); border-radius:20px; }
    input[type=range]::-moz-range-track { height:3px; background:var(--red); border-radius:20px; }
    input[type=range]::-webkit-slider-thumb { appearance:none; width:16px; height:16px; margin-top:-6.5px; border-radius:50%; background:white; border:3px solid var(--red); }
    input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:white; border:3px solid var(--red); }
    .message { position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 107px); left:50%; transform:translateX(-50%); max-width:calc(100% - 30px); width:max-content; z-index:3; text-align:center; font-size:12px; font-weight:670; line-height:1.5; padding:9px 13px; background:#060609dc; border:1px solid #ffffff2a; border-radius:12px; color:#fff; opacity:0; transition:opacity .15s; pointer-events:none; }
    .message.show { opacity:1; }
    .landing .message { bottom:calc(env(safe-area-inset-bottom,0px) + 32px); }
    @media (max-width:350px) { .mode-switch button { padding:10px 7px; } .counter { padding:9px; min-width:115px; } #number { font-size:33px; } }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="scene">
    <video class="camera" id="camera" autoplay muted playsinline></video>
    <canvas id="boxes" aria-label="Červené rámečky rozpoznaných objektů"></canvas>
    <div class="scanline"></div>
  </div>

  <main class="landing" id="landing">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M11 6H6v8M37 6h5v8M6 34v8h8M42 34v8h-8"/><rect x="13" y="17" width="22" height="16" rx="4"/><path d="m20 17 3-4h7l3 4"/><circle cx="24" cy="25" r="4"/></svg></div>
    <h1 class="brand">AI <b>CAMERA</b></h1>
    <div class="choices" role="group" aria-label="Režim detekce">
      <button class="choice" type="button" data-mode="people" aria-pressed="true">LIDÉ</button>
      <button class="choice" type="button" data-mode="cars" aria-pressed="false">AUTA</button>
    </div>
    <button class="start" id="start" type="button">START</button>
  </main>

  <header class="toolbar" aria-label="Detekce">
    <div class="counter"><div class="counter-top"><span class="live-dot"></span><span id="state">AI KAMERA</span></div><div class="counter-big"><span id="number">0</span><span id="plural">LIDÉ</span></div></div>
    <div class="mode-switch" role="group" aria-label="Přepnout detekci">
      <button type="button" data-mode="people" aria-pressed="true">LIDÉ</button>
      <button type="button" data-mode="cars" aria-pressed="false">AUTA</button>
    </div>
  </header>

  <div class="bottom">
    <button class="stop" id="stop" type="button">■ ZASTAVIT</button>
    <div class="zoom">
      <div class="zoomhead"><span>PŘIBLÍŽENÍ</span><output id="zoomLabel" for="zoom">1×</output></div>
      <input id="zoom" type="range" min="1" max="4" step="0.5" value="1" aria-label="Přiblížení kamery">
    </div>
  </div>
  <div class="message" id="message" aria-live="polite"></div>
</div>

<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app'), video = $('camera'), overlay = $('boxes');
  const number = $('number'), plural = $('plural'), state = $('state'), msg = $('message');
  const zoomInput = $('zoom'), zoomLabel = $('zoomLabel'), startButton = $('start');
  const ctx = overlay.getContext('2d', {alpha: true});
  const frame = document.createElement('canvas');
  frame.width = 300; frame.height = 300;
  const frameCtx = frame.getContext('2d', {willReadFrequently: true});
  let mode = 'people', running = false, model = null, stream = null, wake = null;
  let track = null, nativeZoom = false, digitalZoom = 1;
  let generation = 0, currentTile = 0, tiles = [], regionResults = [];
  let inferenceTimer = null, zoomTimer = null, toastTimer = null, busy = false;
  let view = null;

  const CLASS_SETS = {
    people: new Set(['person']),
    cars: new Set(['car','truck','bus'])
  };
  const SCRIPTS = [
    'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
    'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'
  ];

  function toast(text, ms=3200) {
    clearTimeout(toastTimer);
    msg.textContent = text;
    msg.classList.toggle('show', Boolean(text));
    if(text && ms > 0) toastTimer = setTimeout(() => msg.classList.remove('show'), ms);
  }
  function chooseMode(next) {
    if (mode === next) return;
    mode = next;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    plural.textContent = mode === 'people' ? 'LIDÉ' : 'AUTA';
    number.textContent = '0';
    resetDetections();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => chooseMode(b.dataset.mode)));

  function loadScript(url) {
    return new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = url; script.async = true;
      script.onload = resolve; script.onerror = () => reject(new Error('Nepodařilo se načíst AI knihovny. Zkontroluj internet.'));
      document.head.appendChild(script);
    });
  }
  async function loadModel() {
    if(model) return model;
    if(!window.tf) await loadScript(SCRIPTS[0]);
    if(!window.cocoSsd) await loadScript(SCRIPTS[1]);
    if(!window.tf || !window.cocoSsd) throw new Error('AI knihovny nejsou dostupné.');
    try { await tf.setBackend('webgl'); } catch (e) { /* CPU fallback */ }
    await tf.ready();
    model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    return model;
  }

  async function wakeUp() {
    if (!running || document.visibilityState !== 'visible' || !navigator.wakeLock || (wake && !wake.released)) return;
    try { wake = await navigator.wakeLock.request('screen'); } catch(e) { /* unsupported/blocked */ }
  }
  function releaseWake() {
    if (wake) { const old=wake; wake=null; old.release().catch(() => {}); }
  }
  async function openCamera(token) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Kamera vyžaduje HTTPS a povolení přístupu.');
    }
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:24,max:30} }
      });
    } catch(e) {
      if(e.name === 'OverconstrainedError') {
        s = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:'environment'}});
      } else throw e;
    }
    if(!running || token!==generation) {s.getTracks().forEach(t=>t.stop()); return;}
    stream=s; track=s.getVideoTracks()[0];
    nativeZoom=false;
    try {const c=track.getCapabilities?.(); nativeZoom=Boolean(c && c.zoom && Number.isFinite(c.zoom.min) && Number.isFinite(c.zoom.max) && c.zoom.max>c.zoom.min);} catch(e) {}
    video.srcObject = s;
    await video.play();
    await new Promise(r=> video.readyState>=2 ? r() : video.addEventListener('loadeddata',r,{once:true}));
  }

  // Converts the portion of the camera actually visible under object-fit:cover
  // and digital zoom into camera-image pixel coordinates.
  function visibleRegion() {
    const vw=video.videoWidth, vh=video.videoHeight, W=app.clientWidth, H=app.clientHeight;
    if(!vw || !vh || !W || !H) return null;
    const cover=Math.max(W/vw,H/vh);
    const w=Math.min(vw,W/cover/digitalZoom), h=Math.min(vh,H/cover/digitalZoom);
    return {x:(vw-w)/2,y:(vh-h)/2,w,h,W,H};
  }

  function createTiles() {
    view=visibleRegion();
    if(!view) {tiles=[];regionResults=[];return;}
    const {x,y,w,h} = view;
    // Square 300x300 AI crops, approximately 2x3/3x2 at normal zoom.
    // This is more useful for tiny, distant targets than shrinking the entire image.
    const size=Math.min(w,h)*.73;
    const cols=Math.max(1,Math.ceil((w-size)/(size*.88))+1);
    const rows=Math.max(1,Math.ceil((h-size)/(size*.88))+1);
    const next=[];
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) {
      next.push({
        x:x+(cols===1?0:(w-size)*i/(cols-1)),
        y:y+(rows===1?0:(h-size)*j/(rows-1)), w:size,h:size
      });
    }
    tiles=next; regionResults=next.map(()=>[]);
    currentTile=0; number.textContent='0';
    draw();
  }
  function resetDetections() {
    regionResults=tiles.map(()=>[]);
    currentTile=0;
    draw();
  }
  function intersectionOverUnion(a,b) {
    const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y);
    const x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);
    const iw=Math.max(0,x2-x1),ih=Math.max(0,y2-y1),intersection=iw*ih;
    return intersection/(a.w*a.h+b.w*b.h-intersection+1e-5);
  }
  function deduplicate(all) {
    const boxes=all.sort((a,b)=>b.score-a.score), picked=[];
    for(const b of boxes) {
      if(picked.some(p => intersectionOverUnion(p,b)>.28 ||
         (Math.min(p.w,b.w)*Math.min(p.h,b.h)>0 &&
          intersectionArea(p,b)/Math.min(p.w*p.h,b.w*b.h)>.72))) continue;
      picked.push(b);
    }
    return picked;
  }
  function intersectionArea(a,b) {
    return Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*
           Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  }
  function resizeCanvas() {
    const ratio=Math.min(window.devicePixelRatio||1,2);
    const width=Math.round(app.clientWidth*ratio),height=Math.round(app.clientHeight*ratio);
    if(overlay.width!==width || overlay.height!==height){overlay.width=width;overlay.height=height;}
    ctx.setTransform(ratio,0,0,ratio,0,0);
    draw();
  }
  function draw() {
    const W=app.clientWidth,H=app.clientHeight;
    ctx.clearRect(0,0,W,H);
    if(!running || !view || !tiles.length) return;
    const boxes=deduplicate(regionResults.flat());
    number.textContent=String(boxes.length);
    ctx.lineWidth=2.2; ctx.strokeStyle='#ff283b';
    for(const b of boxes) {
      const x=(b.x-view.x)*W/view.w,y=(b.y-view.y)*H/view.h;
      const w=b.w*W/view.w,h=b.h*H/view.h;
      if(x>=W || y>=H || x+w<=0 || y+h<=0) continue;
      const dx=Math.max(0,x),dy=Math.max(0,y),dw=Math.min(W,x+w)-dx,dh=Math.min(H,y+h)-dy;
      if(dw<=0 || dh<=0) continue;
      ctx.strokeRect(dx,dy,dw,dh);
      const c=Math.min(15,dw*.25,dh*.25);
      ctx.lineWidth=3.2;
      ctx.beginPath();
      ctx.moveTo(dx,dy+c);ctx.lineTo(dx,dy);ctx.lineTo(dx+c,dy);
      ctx.moveTo(dx+dw-c,dy);ctx.lineTo(dx+dw,dy);ctx.lineTo(dx+dw,dy+c);
      ctx.moveTo(dx,dy+dh-c);ctx.lineTo(dx,dy+dh);ctx.lineTo(dx+c,dy+dh);
      ctx.moveTo(dx+dw-c,dy+dh);ctx.lineTo(dx+dw,dy+dh);ctx.lineTo(dx+dw,dy+dh-c);
      ctx.stroke();ctx.lineWidth=2.2;
    }
  }

  async function detectNext(token) {
    if(!running || token!==generation || !model || busy) return;
    if(document.visibilityState==='hidden') return;
    if(video.readyState<2 || !tiles.length) { inferenceTimer=setTimeout(()=>detectNext(token),150);return; }
    busy=true;
    const tileIndex=currentTile++ % tiles.length;
    const t=tiles[tileIndex];
    try {
      frameCtx.drawImage(video, t.x,t.y,t.w,t.h, 0,0,300,300);
      // Lower cutoff helps small people. May also increase false positives.
      const minScore=mode==='people'? .24 : .33;
      const predictions=await model.detect(frame,60,minScore);
      if(!running || token!==generation) return;
      const accepted=predictions.filter(p=> CLASS_SETS[mode].has(p.class) && p.score>=minScore);
      regionResults[tileIndex]=accepted.map(p=>({
        x:t.x+p.bbox[0]/300*t.w,
        y:t.y+p.bbox[1]/300*t.h,
        w:Math.max(0,p.bbox[2]/300*t.w),
        h:Math.max(0,p.bbox[3]/300*t.h),
        score:p.score
      })).filter(p=>p.w>=2 && p.h>=2);
      draw();
      state.textContent='LIVE';
    } catch(e) {
      console.error('AI detekce:',e);
      state.textContent='AI CHYBA';
      toast('Chyba rozpoznávání. Obnov stránku, pokud přetrvává.',4000);
    } finally {
      busy=false;
      if(running && token===generation && document.visibilityState==='visible') {
        inferenceTimer=setTimeout(()=>detectNext(token),60);
      }
    }
  }

  async function setZoom() {
    const wanted=Number(zoomInput.value);
    zoomLabel.textContent=wanted.toLocaleString('cs-CZ',{maximumFractionDigits:1})+'×';
    if(!running || !track) return;
    const token=generation;
    if(nativeZoom) {
      try {
        const cap=track.getCapabilities();
        const z=Math.max(cap.zoom.min,Math.min(cap.zoom.max,wanted));
        await track.applyConstraints({advanced:[{zoom:z}]});
        if(token!==generation) return;
        // When hardware zoom maxes out, complete the rest via digital crop.
        digitalZoom=wanted/z;
      } catch(e) {nativeZoom=false;digitalZoom=wanted;}
    } else digitalZoom=wanted;
    video.style.transform=`scale(${digitalZoom})`;
    createTiles();
  }
  zoomInput.addEventListener('input',()=>{
    zoomLabel.textContent=Number(zoomInput.value).toLocaleString('cs-CZ',{maximumFractionDigits:1})+'×';
    if(!running) return;
    clearTimeout(zoomTimer);
    zoomTimer=setTimeout(setZoom,180);
  });

  function stop() {
    running=false; generation++;
    clearTimeout(inferenceTimer); clearTimeout(zoomTimer);
    if(stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
    video.pause(); video.srcObject=null;
    track=null; nativeZoom=false; digitalZoom=1; video.style.transform='scale(1)';
    releaseWake(); tiles=[];regionResults=[];view=null;
    ctx.clearRect(0,0,app.clientWidth,app.clientHeight);
    app.classList.remove('is-running');
    startButton.disabled=false; startButton.textContent='START';
    state.textContent='AI KAMERA'; number.textContent='0';
    zoomInput.value=1;zoomLabel.textContent='1×';
  }

  async function start() {
    if(running) return;
    const token=++generation;
    running=true;
    startButton.disabled=true;
    app.classList.add('is-running');
    state.textContent='START';
    number.textContent='0';
    resizeCanvas();
    try {
      // Camera permission prompt is requested directly from the Start gesture.
      const cameraReady=openCamera(token);
      // Capture errors now so an early model-loading failure does not become
      // an unhandled rejection while the camera permission dialog is open.
      const modelReady=loadModel().then(value=>({value}),error=>({error}));
      await cameraReady;
      if(!running || token!==generation) return;
      createTiles();resizeCanvas();
      await wakeUp();
      state.textContent='NAČÍTÁNÍ AI';
      toast('Načítám rozpoznávání…',0);
      const loaded=await modelReady;
      if(!running || token!==generation) return;
      if(loaded.error) throw loaded.error;
      toast(''); state.textContent='LIVE';
      detectNext(token);
    } catch(err) {
      if(token!==generation) return;
      console.error(err);
      stop();
      let explanation=err && err.message ? err.message : 'Nepodařilo se spustit kameru.';
      if(['NotAllowedError','PermissionDeniedError','SecurityError'].includes(err.name)) explanation='Povol přístup ke kameře v nastavení prohlížeče.';
      if(['NotFoundError','DevicesNotFoundError'].includes(err.name)) explanation='Kamera není dostupná.';
      if(['NotReadableError','TrackStartError'].includes(err.name)) explanation='Kameru právě používá jiná aplikace.';
      toast(explanation,7500);
    }
  }
  startButton.addEventListener('click',start);
  $('stop').addEventListener('click',stop);
  document.addEventListener('visibilitychange',async()=>{
    if(!running) return;
    if(document.visibilityState==='visible') {
      await wakeUp();
      if(!busy && model) {clearTimeout(inferenceTimer);detectNext(generation);}
    } else {
      clearTimeout(inferenceTimer);
      state.textContent='POZASTAVENO';
    }
  });
  window.addEventListener('resize',()=>{resizeCanvas(); if(running)createTiles();});
  window.addEventListener('pagehide',stop);
  resizeCanvas();
})();
</script>
</body>
</html>
